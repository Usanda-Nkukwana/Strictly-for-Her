<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Add a new memory to Zandisiwe's Memory Lane">
	<link rel="stylesheet" href="Edit.css">
	<link rel="icon" type="image/svg+xml" href="sunflower.png">
	<title>Add a Memory | Zandisiwe Kemela</title>
</head>
<body>
	<main class="edit-shell">
		<a class="back-link" href="index.html">&#8592; Back to Memory Lane</a>
		<section class="edit-panel" aria-labelledby="edit-title">
			<p class="eyebrow">Memory Lane</p>
			<h1 id="edit-title">Add a moment worth keeping.</h1>
			<p class="intro">Upload a picture and give it a little context. It will appear on the home page with the other memories.</p>

			<form id="memory-form">
				<label for="memory-image">Picture</label>
				<input id="memory-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
				<small>JPEG, PNG, or WebP up to 5 MB.</small>

				<label for="memory-description">Description</label>
				<textarea id="memory-description" name="description" rows="4" placeholder="What makes this moment special?" required></textarea>

				<div class="form-row">
					<div>
						<label for="memory-date">Date</label>
						<input id="memory-date" name="memory_date" type="date" required>
					</div>
					<div>
						<label for="memory-location">Location</label>
						<input id="memory-location" name="location" type="text" placeholder="Cape Town" required>
					</div>
				</div>

				<button class="submit-button" type="submit">Save to Memory Lane <span aria-hidden="true">&#8594;</span></button>
				<p class="form-status" id="form-status" role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>
	<script src="supabase-config.js"></script>
	<script src="Edit.js"></script>
</body>
</html>
